name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FE_VERSION: v26.6.0
  FE_VERSION_LINE: fe 26.6.0 (5b3f96a)
  FE_SHA256: 697081cb9265bd1be7a5d33e6bb0c8559ee5ff542abab9a046540fc151b4edaa
  SOLC_VERSION: v0.8.30
  SOLC_SHA256: f3e987dc6ecebd4bd350c48edcbc320b46cf9e3109bd3fc3d88f1acaf4c428f7
  SPEC_TESTS_TAG: v1.6.0-beta.0

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Fixture integrity
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install pycryptodome==3.23.0
          "$RUNNER_TEMP/venv/bin/python3" -I -m py_compile tools/*.py
          "$RUNNER_TEMP/venv/bin/python3" -I -m unittest discover -s tools -p "test_*.py"
          "$RUNNER_TEMP/venv/bin/python3" -I tools/oracle_mpt.py fixtures/*.json
          "$RUNNER_TEMP/venv/bin/python3" -I tools/oracle_ssz.py fixtures/*.json
          "$RUNNER_TEMP/venv/bin/python3" -I tools/synth_trie.py check
          "$RUNNER_TEMP/venv/bin/python3" -I tools/gen_vectors.py check
          "$RUNNER_TEMP/venv/bin/python3" -I tools/gen_fixtures.py check
          "$RUNNER_TEMP/venv/bin/python3" -I tools/gen_bench.py check
      - name: Install solc, checked against its SHA-256
        run: |
          mkdir -p "$RUNNER_TEMP/solc-bin"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/solc-bin/solc" "https://github.com/ethereum/solidity/releases/download/$SOLC_VERSION/solc-static-linux"
          echo "$SOLC_SHA256  $RUNNER_TEMP/solc-bin/solc" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/solc-bin/solc"
      - name: Vendored consensus-spec vectors match upstream at the pinned tag
        shell: bash
        run: |
          base="https://raw.githubusercontent.com/ethereum/consensus-spec-tests/$SPEC_TESTS_TAG"
          for container in Validator BeaconBlockHeader; do
            for case in case_0 case_1 case_2 case_3 case_4; do
              for file in value.yaml roots.yaml; do
                curl -fsSL --retry 3 "$base/tests/mainnet/fulu/ssz_static/$container/ssz_random/$case/$file"                   | diff - "fixtures/consensus_spec/$container/$case/$file"
              done
            done
          done
          curl -fsSL --retry 3 "$base/LICENSE" | diff - fixtures/consensus_spec/LICENSE
      - name: Trie roots against the Ethereum execution specification
        run: |
          python3 -m venv "$RUNNER_TEMP/spec"
          "$RUNNER_TEMP/spec/bin/pip" install pycryptodome==3.23.0 -r tools/requirements-spec.txt
          "$RUNNER_TEMP/spec/bin/python3" -I tools/spec_crosscheck.py
      - name: Install Fe from the release, checked against its SHA-256
        run: |
          mkdir -p "$RUNNER_TEMP/fe-bin"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/fe-bin/fe" "https://github.com/argotorg/fe/releases/download/$FE_VERSION/fe_linux_amd64"
          echo "$FE_SHA256  $RUNNER_TEMP/fe-bin/fe" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/fe-bin/fe"
          echo "$RUNNER_TEMP/fe-bin" >> "$GITHUB_PATH"
      - name: Fe version
        run: |
          fe --version
          test "$(fe --version)" = "$FE_VERSION_LINE"
      - name: Format check
        run: fe fmt --check
      - name: Type check
        run: fe check
      - name: Tests on the EVM backend
        run: fe test
      - name: Tests on the EVM backend at -O 2
        run: fe test -O 2
      - name: Tests on the native backend
        run: fe test --backend native
      - name: Native CLI builds, verifies, and refuses tampers
        run: |
          cd cli
          fe fmt --check
          fe build --backend native -O 2 --emit executable --out-dir "$RUNNER_TEMP/cli-out" .
          cd ..
          "$RUNNER_TEMP/venv/bin/python3" -I tools/check_cli.py "$RUNNER_TEMP/cli-out/assay" fixtures
          "$RUNNER_TEMP/venv/bin/python3" -I tools/run_vectors.py "$RUNNER_TEMP/cli-out/assay"
      - name: Gas benchmark reproduces the committed CSV
        run: |
          fe bench bench --solc "$RUNNER_TEMP/solc-bin/solc" -o "$RUNNER_TEMP/benchout"
          diff "$RUNNER_TEMP/benchout/gas_benchmark.csv" docs/gas_benchmark.csv
