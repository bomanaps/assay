name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FE_COMMIT: b182b0126bbe535433c2698e0fdc96e3899931c7
  SONATINA_BASE: 279793642564e781846bdea1561825f64aee300a
  SONATINA_COMMIT: 63acfe542a255ad1f57f9995348b7b2c99680729

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Fixture integrity
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install pycryptodome==3.23.0
          "$RUNNER_TEMP/venv/bin/python3" -I tools/capture_getproof.py verify fixtures/*.json
          "$RUNNER_TEMP/venv/bin/python3" -I tools/oracle_mpt.py fixtures/*.json
          "$RUNNER_TEMP/venv/bin/python3" -I tools/gen_fixtures.py check
      - name: Check out Fe at the pinned commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: argotorg/fe
          ref: ${{ env.FE_COMMIT }}
          path: fe
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - name: Point Fe at the Sonatina commit that carries the GVN fix from fe-lang/sonatina#488
        working-directory: fe
        run: |
          test "$(grep -c "$SONATINA_BASE" Cargo.toml)" -ge 1
          sed -i "s/$SONATINA_BASE/$SONATINA_COMMIT/g" Cargo.toml
          test "$(grep -c "$SONATINA_BASE" Cargo.toml)" -eq 0
      - name: Generate tree-sitter parser
        working-directory: fe/crates/tree-sitter-fe
        run: |
          npm ci --ignore-scripts
          npm rebuild tree-sitter-cli
          npx tree-sitter generate --abi=14
      - name: Cache Fe build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: fe
          cache-on-failure: true
      - name: Build Fe
        run: cargo build --release -p fe --features cranelift --manifest-path fe/Cargo.toml
      - name: Fe version
        run: fe/target/release/fe --version
      - name: Format check
        run: fe/target/release/fe fmt --check
      - name: Type check
        run: fe/target/release/fe check
      - name: Tests on the EVM backend
        run: fe/target/release/fe test
      - name: Tests on the EVM backend at -O 2
        run: fe/target/release/fe test -O 2
      - name: Tests on the native backend
        run: fe/target/release/fe test --backend native
