name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FE_VERSION: v26.6.0
  FE_VERSION_LINE: fe 26.6.0 (5b3f96a)
  FE_SHA256: 697081cb9265bd1be7a5d33e6bb0c8559ee5ff542abab9a046540fc151b4edaa

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Fixture integrity
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install pycryptodome==3.23.0
          "$RUNNER_TEMP/venv/bin/python3" -I -m py_compile tools/*.py
          "$RUNNER_TEMP/venv/bin/python3" -I -m unittest discover -s tools -p "test_*.py"
          "$RUNNER_TEMP/venv/bin/python3" -I tools/oracle_mpt.py fixtures/*.json
          "$RUNNER_TEMP/venv/bin/python3" -I tools/oracle_ssz.py fixtures/*.json
          "$RUNNER_TEMP/venv/bin/python3" -I tools/synth_trie.py check
          "$RUNNER_TEMP/venv/bin/python3" -I tools/gen_fixtures.py check
      - name: Trie roots against the Ethereum execution specification
        run: |
          python3 -m venv "$RUNNER_TEMP/spec"
          "$RUNNER_TEMP/spec/bin/pip" install pycryptodome==3.23.0 -r tools/requirements-spec.txt
          "$RUNNER_TEMP/spec/bin/python3" -I tools/spec_crosscheck.py
      - name: Install Fe from the release, checked against its SHA-256
        run: |
          mkdir -p "$RUNNER_TEMP/fe-bin"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/fe-bin/fe" "https://github.com/argotorg/fe/releases/download/$FE_VERSION/fe_linux_amd64"
          echo "$FE_SHA256  $RUNNER_TEMP/fe-bin/fe" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/fe-bin/fe"
          echo "$RUNNER_TEMP/fe-bin" >> "$GITHUB_PATH"
      - name: Fe version
        run: |
          fe --version
          test "$(fe --version)" = "$FE_VERSION_LINE"
      - name: Format check
        run: fe fmt --check
      - name: Type check
        run: fe check
      - name: Tests on the EVM backend
        run: fe test
      - name: Tests on the EVM backend at -O 2
        run: fe test -O 2
      - name: Tests on the native backend
        run: fe test --backend native
