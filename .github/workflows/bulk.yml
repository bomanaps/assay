name: Bulk

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

env:
  FE_VERSION: v26.6.0
  FE_SHA256: 697081cb9265bd1be7a5d33e6bb0c8559ee5ff542abab9a046540fc151b4edaa

jobs:
  bulk-verify-mainnet-accounts:
    if: github.repository == 'bomanaps/assay'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
      - name: Install Fe from the release, checked against its SHA-256
        run: |
          mkdir -p "$RUNNER_TEMP/fe-bin"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/fe-bin/fe" "https://github.com/argotorg/fe/releases/download/$FE_VERSION/fe_linux_amd64"
          echo "$FE_SHA256  $RUNNER_TEMP/fe-bin/fe" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/fe-bin/fe"
          echo "$RUNNER_TEMP/fe-bin" >> "$GITHUB_PATH"
      - name: Build the CLI
        run: |
          cd cli
          fe build --backend native -O 2 --emit executable --out-dir "$RUNNER_TEMP/cli-out" .
      - name: Verify 1500 fresh mainnet accounts from one beacon root
        env:
          RPC_URL: ${{ secrets.RPC_URL || 'https://ethereum-rpc.publicnode.com' }}
          BEACON_URL: ${{ secrets.BEACON_URL || 'https://ethereum-beacon-api.publicnode.com' }}
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -r tools/requirements-capture.txt
          cd tools
          "$RUNNER_TEMP/venv/bin/python3" -I bulk_verify.py "$RUNNER_TEMP/cli-out/assay" --accounts 1500 --blocks 10
      - name: Commit the harvest before the state capture, so a capture failure cannot discard it
        run: |
          git config user.name "bulk-verification"
          git config user.email "actions@users.noreply.github.com"
          git add docs/bulk_receipts.json docs/bulk_stats.json
          git commit -m "Bulk: fresh mainnet accounts verified from one beacon root"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Rebuild the state-heavy run arguments from a fresh beacon state
        env:
          RPC_URL: ${{ secrets.RPC_URL || 'https://ethereum-rpc.publicnode.com' }}
          BEACON_URL: ${{ secrets.BEACON_URL || 'https://ethereum-beacon-api.publicnode.com' }}
        run: |
          work="$RUNNER_TEMP/statecap"
          mkdir -p "$work/fixtures"
          cp -R tools "$work/tools"
          cd "$work"
          source="${CHECKPOINT_URL:-https://mainnet.checkpoint.sigp.io}"
          for try in 1 2; do
            curl -fsSL -m 1500 -H "Accept: application/octet-stream" \
              -o state_finalized.ssz \
              "$source/eth/v2/debug/beacon/states/finalized" && break
            echo "state download try $try failed"; sleep 15
          done
          test -s state_finalized.ssz
          slot=$("$RUNNER_TEMP/venv/bin/python3" -c "import struct; print(struct.unpack('<Q', open('state_finalized.ssz','rb').read(48)[40:48])[0])")
          "$RUNNER_TEMP/venv/bin/python3" -I tools/capture_beacon.py validator state_finalized.ssz 2345678 validator_beacon
          "$RUNNER_TEMP/venv/bin/python3" -I tools/capture_beacon.py history state_finalized.ssz $((slot - 7000)) history_day_old
          "$RUNNER_TEMP/venv/bin/python3" -I tools/capture_beacon.py deephistory state_finalized.ssz 6209536 history_capella_first
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/venv/bin/python3" -I tools/gen_run_args.py "$work/fixtures" docs/run.json check
      - name: Commit the run arguments
        run: |
          git add docs/run.json
          git commit -m "Bulk: state proof arguments rebuilt and checked"
          git pull --rebase origin main
          git push origin HEAD:main
